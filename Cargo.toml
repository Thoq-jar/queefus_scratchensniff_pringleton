[package]
name = "queefus_scratchensniff_pringleton"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pringleton"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"

[profile.release]
opt-level = 3
